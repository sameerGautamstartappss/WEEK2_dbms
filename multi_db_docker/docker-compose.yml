
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: unless-stopped
    env_file: .env
    ports:
      - "3306:3306"                             # 🔗 Expose MySQL port
    volumes:
      - mysql_data:/var/lib/mysql               # 💾 Persistent volume
    
